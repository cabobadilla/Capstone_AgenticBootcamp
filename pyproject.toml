[project]
name = "ai-tutor"
version = "0.1.0"
description = "Generic multi-agent AI Tutor platform. First validation Pack: CCA-F."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Bobadilla" }]
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "voyageai>=0.3.0",
    "openai>=1.50.0",
    "trafilatura>=1.12.0",
    "nbformat>=5.10.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.0",
    "gradio>=5.0.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
observability = [
    "langsmith>=0.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_tutor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
